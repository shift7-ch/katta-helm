version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # even for `.github/workflows`
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "ci"

  - package-ecosystem: "docker"
    directories: # tags written as `{{ .Values… }}` are skipped, Dependabot does not render the chart
      - "/"
      - "/templates"
    schedule:
      interval: "monthly"
    groups:
      docker:
        patterns:
          - "*"
    labels:
      - "dependencies"
