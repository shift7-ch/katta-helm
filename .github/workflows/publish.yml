name: Publish

on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for checkout
      id-token: write # Required for the attestations step
      attestations: write # Required for the attestations step
      artifact-metadata: write # Required for the attestations step
      packages: write # Required for pushing the chart to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history to count commits for the patch version

      - name: Setup Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          # Major and minor version from Chart.yaml; patch version is the number of commits since its `version` line
          # last changed, so setting `version: 1.1.0` publishes 1.1.0 and the following commits 1.1.1, 1.1.2, ...
          major_minor=$(sed -n 's/^version: *"\{0,1\}\([0-9][0-9]*\.[0-9][0-9]*\)\.[0-9][0-9]*"\{0,1\} *$/\1/p' Chart.yaml)
          if [[ -z "$major_minor" ]]; then
            echo "::error::Expected 'version: <major>.<minor>.<patch>' in Chart.yaml" >&2
            exit 1
          fi
          base=$(git log -1 --format=%H -G '^version:' -- Chart.yaml)
          patch=$(git rev-list --count "${base}..HEAD")
          echo "version=${major_minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint .

      - name: Package chart
        run: |
          mkdir -p dist
          helm package . --destination dist --version "${{ steps.version.outputs.version }}"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Helm Registry: Login to GHCR"
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        id: push
        run: |
          set -euo pipefail
          push_output=$(helm push "dist/katta-server-${{ steps.version.outputs.version }}.tgz" "oci://ghcr.io/shift7-ch/katta-helm" 2>&1)
          echo "$push_output"

          digest=$(printf '%s\n' "$push_output" | grep -Eo 'sha256:[0-9a-fA-F]{64}' | tail -n1 || true)
          if [[ -z "$digest" ]]; then
            echo "Failed to extract chart digest from helm push output" >&2
            echo "Raw helm push output:" >&2
            echo "$push_output" >&2
            exit 1
          fi

          echo "chart_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign chart with cosign (keyless)
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/shift7-ch/katta-helm/katta-server@${{ steps.push.outputs.chart_digest }}"

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: "ghcr.io/shift7-ch/katta-helm/katta-server"
          subject-digest: ${{ steps.push.outputs.chart_digest }}
          push-to-registry: true
