name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for checkout
      id-token: write # Required for the attestations step
      attestations: write # Required for the attestations step
      artifact-metadata: write # Required for the attestations step
      packages: write # Required for pushing the chart to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Helm
        uses: Azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Tag names can contain shell metacharacters and this value flows into later `run:` interpolations,
          # so allow only OCI-tag-safe characters and fail fast otherwise.
          if [[ ! "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Refusing unsafe version '${version}' derived from tag '${GITHUB_REF_NAME}' (allowed: [0-9A-Za-z._-])" >&2
            exit 1
          fi
          chart_version=$(helm show chart . | sed -n 's/^version: //p')
          if [[ "$version" != "$chart_version" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match version '${chart_version}' in Chart.yaml" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint .

      - name: Package chart
        run: |
          mkdir -p dist
          helm package . --destination dist

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Helm Registry: Login to GHCR"
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        id: push
        run: |
          set -euo pipefail
          push_output=$(helm push "dist/katta-server-${{ steps.version.outputs.version }}.tgz" "oci://ghcr.io/shift7-ch/katta-helm" 2>&1)
          echo "$push_output"

          digest=$(printf '%s\n' "$push_output" | grep -Eo 'sha256:[0-9a-fA-F]{64}' | tail -n1 || true)
          if [[ -z "$digest" ]]; then
            echo "Failed to extract chart digest from helm push output" >&2
            echo "Raw helm push output:" >&2
            echo "$push_output" >&2
            exit 1
          fi

          echo "chart_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign chart with cosign (keyless)
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/shift7-ch/katta-helm/katta-server@${{ steps.push.outputs.chart_digest }}"

      - name: Generate artifact attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: "ghcr.io/shift7-ch/katta-helm/katta-server"
          subject-digest: ${{ steps.push.outputs.chart_digest }}
          push-to-registry: true
